plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        backrooms_tape {
            sourceSet sourceSets.main
        }
    }
}